name: Android build and emulator checks
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify all seeded recipe matching rules
        run: python3 test_matching.py
      - name: Build and lint
        run: gradle assembleDebug lintDebug --stacktrace
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python3 ci_smoke.py
      - name: Save APK reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart-pantry-build-and-evidence
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
            evidence/
          retention-days: 14
